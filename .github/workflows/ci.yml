name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run firmware host tests
        run: ./scripts/test.sh

  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git python3
      - name: Install Arm GNU Toolchain + pico-sdk
        run: ./scripts/setup-toolchain.sh --skip-picotool
      - name: Build
        run: ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bme280_monitor
          path: |
            firmware/build/bme280_monitor.uf2
            firmware/build/bme280_monitor.elf
          if-no-files-found: error

  collector:
    name: Collector tests
    runs-on: ubuntu-latest
    services:
      # The db-backed test runs against a real TimescaleDB instance, so the
      # hypertable conversion in db/schema.sql is exercised on every push.
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: pico
          POSTGRES_DB: pico_monitor
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pico"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: pico_monitor
      PGUSER: pico
      PGPASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Apply schema
        run: psql -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Install
        working-directory: server
        run: npm ci
      - name: Test
        working-directory: server
        run: npm test

  ui:
    name: UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Build
        working-directory: ui
        run: npm run build
