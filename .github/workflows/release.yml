name: Release

# v* タグを push すると、ファームウェアをビルドして UF2 を GitHub Release に添付します。
# ツールチェーンを持っていない人でも、Release から UF2 をダウンロードして
# BOOTSEL + ドラッグ&ドロップ (または scripts/flash.sh) で書き込めるようにするためです。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  firmware:
    name: Build firmware and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git python3

      - name: Install Arm GNU Toolchain + pico-sdk
        run: ./scripts/setup-toolchain.sh --skip-picotool

      - name: Run host tests
        run: ./scripts/test.sh

      - name: Build
        run: ./scripts/build.sh

      - name: Checksums
        run: |
          cd firmware/build
          sha256sum bme280_monitor.uf2 > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Idempotent: if the release already exists (e.g. created by hand
          # before the tag's workflow ran), upload the assets to it instead
          # of failing on a duplicate tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              firmware/build/bme280_monitor.uf2 \
              firmware/build/SHA256SUMS \
              --clobber
          else
            gh release create "$TAG" \
              firmware/build/bme280_monitor.uf2 \
              firmware/build/SHA256SUMS \
              --title "$TAG" \
              --generate-notes
          fi
